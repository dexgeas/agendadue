<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="50%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>
    <filter id="glassShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#0f172a" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- App Rounded Squircle Background -->
  <rect width="512" height="512" rx="120" fill="url(#bgGrad)"/>
  
  <!-- Subtle Ambient Top Light -->
  <circle cx="140" cy="120" r="180" fill="#60A5FA" opacity="0.4" filter="blur(40px)"/>
  
  <!-- Glass Calendar Sheet -->
  <rect x="76" y="86" width="360" height="340" rx="36" fill="url(#glassGrad)" stroke="rgba(255,255,255,0.4)" stroke-width="3" filter="url(#glassShadow)"/>
  
  <!-- Calendar Header Strip -->
  <path d="M 76 122 Q 76 86 112 86 L 400 86 Q 436 86 436 122 L 436 160 L 76 160 Z" fill="rgba(255,255,255,0.2)"/>
  
  <!-- Binder Rings -->
  <rect x="150" y="66" width="24" height="44" rx="12" fill="#FFFFFF"/>
  <rect x="338" y="66" width="24" height="44" rx="12" fill="#FFFFFF"/>
  
  <!-- Text: 2.0 -->
  <text x="256" y="275" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif" font-size="96" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="-2">2.0</text>
  <text x="256" y="325" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', Roboto, sans-serif" font-size="28" font-weight="600" fill="#DBEAFE" text-anchor="middle" letter-spacing="4">AGENDA</text>
  
  <!-- Floating Video/Webinar Badge (GoTo accent) -->
  <g transform="translate(310, 310)">
    <circle cx="65" cy="65" r="65" fill="url(#accentGrad)" stroke="#FFFFFF" stroke-width="5" filter="url(#glassShadow)"/>
    <!-- Video Camera Icon -->
    <path d="M42 48 C42 44.68 44.68 42 48 42 L72 42 C75.31 42 78 44.68 78 48 L78 82 C78 85.31 75.31 88 72 88 L48 88 C44.68 88 42 85.31 42 82 Z" fill="#FFFFFF"/>
    <path d="M78 57 L96 46 C97.5 45.1 99 46.2 99 48 L99 82 C99 83.8 97.5 84.9 96 84 L78 73 Z" fill="#FFFFFF"/>
  </g>
</svg>
